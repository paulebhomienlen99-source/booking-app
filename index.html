<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; color: white; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 2.5em; margin: 0; }
    .auth-buttons { display: flex; gap: 10px; }
    .auth-buttons button { padding: 8px 16px; font-size: 0.9em; }
    .welcome { color: white; }
    .hidden { display: none !important; }
    .services, .bookings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .card h3 { color: #667eea; margin-bottom: 10px; }
    .card p { color: #666; margin-bottom: 8px; font-size: 0.95em; }
    .price { font-size: 1.5em; color: #764ba2; font-weight: bold; }
    button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; transition: 0.3s; }
    button:hover { background: #764ba2; }
    .booking-form { background: white; padding: 30px; border-radius: 10px; margin-bottom: 40px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #333; font-weight: 500; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; }
    input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
    .status { padding: 5px 10px; border-radius: 3px; font-size: 0.85em; font-weight: bold; }
    .status.pending { background: #ffc107; color: #333; }
    .status.confirmed { background: #28a745; color: white; }
    .status.cancelled { background: #dc3545; color: white; }
    .auth-form { background: white; padding: 40px; border-radius: 10px; max-width: 400px; margin: 50px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .auth-form h2 { color: #667eea; margin-bottom: 20px; }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .auth-tabs button { padding: 8px 16px; background: #ddd; color: #333; }
    .auth-tabs button.active { background: #667eea; color: white; }
    .error { color: #dc3545; margin-bottom: 10px; }
    .success { color: #28a745; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Auth Section -->
    <div id="authSection" class="auth-form">
      <h2>Welcome to Booking App</h2>
      <div class="auth-tabs">
        <button class="active" onclick="switchTab('login')">Login</button>
        <button onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div id="loginForm">
        <div class="error" id="loginError"></div>
        <div class="form-group">
          <label for="loginEmail">Email:</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button onclick="login()" style="width: 100%;">Login</button>
      </div>

      <div id="signupForm" class="hidden">
        <div class="error" id="signupError"></div>
        <div class="form-group">
          <label for="signupName">Name:</label>
          <input type="text" id="signupName" required>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email:</label>
          <input type="email" id="signupEmail" required>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password:</label>
          <input type="password" id="signupPassword" required>
        </div>
        <button onclick="signup()" style="width: 100%;">Sign Up</button>
      </div>
    </div>

    <!-- Main App Section (Hidden until logged in) -->
    <div id="appSection" class="hidden">
      <header>
        <div>
          <h1>📅 Booking App</h1>
          <p style="color: white;">Reserve your favorite services</p>
        </div>
        <div class="auth-buttons">
          <span class="welcome" id="welcomeMsg"></span>
          <button onclick="logout()">Logout</button>
        </div>
      </header>

      <div class="booking-form">
        <h2>Make a Booking</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;">
          <div class="form-group">
            <label for="service">Service:</label>
            <select id="service" required></select>
          </div>
          <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="time">Time:</label>
            <input type="time" id="time" required>
          </div>
        </div>
        <button onclick="createBooking()" style="margin-top: 20px; width: 100%;">Book Now</button>
      </div>

      <h2 style="color: white; margin-bottom: 20px;">Available Services</h2>
      <div class="services" id="services"></div>

      <h2 style="color: white; margin-bottom: 20px;">Your Bookings</h2>
      <div class="bookings" id="bookings"></div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3001';
    let token = localStorage.getItem('token');
    let userName = localStorage.getItem('userName');

    // Initialize
    if (token) {
      showApp();
    } else {
      showAuth();
    }

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
      document.querySelectorAll('.auth-tabs button').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');

      if (!email || !password) {
        errorDiv.textContent = 'Email and password required';
        return;
      }

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
          const data = await res.json();
          errorDiv.textContent = data.error || 'Login failed';
          return;
        }

        const data = await res.json();
        token = data.token;
        userName = data.name;
        localStorage.setItem('token', token);
        localStorage.setItem('userName', userName);
        showApp();
      } catch (err) {
        errorDiv.textContent = 'Connection error';
      }
    }

    async function signup() {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const errorDiv = document.getElementById('signupError');

      if (!name || !email || !password) {
        errorDiv.textContent = 'All fields required';
        return;
      }

      try {
        const res = await fetch(`${API}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        if (!res.ok) {
          const data = await res.json();
          errorDiv.textContent = data.error || 'Signup failed';
          return;
        }

        const data = await res.json();
        token = data.token;
        userName = name;
        localStorage.setItem('token', token);
        localStorage.setItem('userName', userName);
        showApp();
      } catch (err) {
        errorDiv.textContent = 'Connection error';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('userName');
      token = null;
      showAuth();
    }

    function showAuth() {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('welcomeMsg').textContent = `Welcome, ${userName}!`;
      loadServices();
      loadBookings();
      setInterval(loadBookings, 5000);
    }

    async function loadServices() {
      try {
        const res = await fetch(`${API}/services`);
        const services = await res.json();
        const servicesDiv = document.getElementById('services');
        const serviceSelect = document.getElementById('service');
        servicesDiv.innerHTML = services.map(s => `
          <div class="card">
            <h3>${s.name}</h3>
            <p>${s.description}</p>
            <p>Duration: ${s.duration_minutes} min</p>
            <p class="price">$${s.price}</p>
          </div>
        `).join('');
        serviceSelect.innerHTML = '<option>Select a service</option>' + services.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      } catch (err) {
        console.error('Error loading services:', err);
      }
    }

    async function loadBookings() {
      try {
        const res = await fetch(`${API}/bookings`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const bookings = await res.json();
        const bookingsDiv = document.getElementById('bookings');
        if (bookings.length === 0) {
          bookingsDiv.innerHTML = '<p style="color: white; text-align: center;">No bookings yet. Make one now!</p>';
          return;
        }
        bookingsDiv.innerHTML = bookings.map(b => `
          <div class="card">
            <h3>${b.name}</h3>
            <p>Date: ${b.booking_date} at ${b.booking_time}</p>
            <p>Duration: ${b.duration_minutes} min</p>
            <p>Price: $${b.price}</p>
            <p>Status: <span class="status ${b.status}">${b.status}</span></p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading bookings:', err);
      }
    }

    async function createBooking() {
      const service_id = document.getElementById('service').value;
      const booking_date = document.getElementById('date').value;
      const booking_time = document.getElementById('time').value;

      if (!service_id || !booking_date || !booking_time) {
        alert('Please fill all fields');
        return;
      }

      try {
        const res = await fetch(`${API}/bookings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ service_id, booking_date, booking_time })
        });

        if (res.ok) {
          alert('Booking created! Check your email for confirmation.');
          document.getElementById('date').value = '';
          document.getElementById('time').value = '';
          document.getElementById('service').value = '';
          loadBookings();
        } else {
          alert('Failed to create booking');
        }
      } catch (err) {
        console.error('Error creating booking:', err);
      }
    }
  </script>
</body>
</html>
