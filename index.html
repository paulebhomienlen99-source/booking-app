<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; color: white; margin-bottom: 40px; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .hidden { display: none !important; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 20px; }
    .card h3 { color: #667eea; margin-bottom: 10px; }
    .card p { color: #666; margin-bottom: 8px; }
    .price { font-size: 1.5em; color: #764ba2; font-weight: bold; }
    button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-right: 5px; }
    button:hover { background: #764ba2; }
    .cancel-btn { background: #dc3545; }
    .cancel-btn:hover { background: #c82333; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; font-size: 1em; }
    .auth-form { background: white; padding: 40px; border-radius: 10px; max-width: 400px; margin: 50px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    .services, .bookings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .logout { float: right; }
    .category-title { color: white; font-size: 1.5em; margin-top: 30px; margin-bottom: 15px; text-transform: capitalize; }
    .category-emoji { margin-right: 10px; }
    .status-cancelled { color: #dc3545; font-weight: bold; }
    .status-pending { color: #ffc107; font-weight: bold; }
    .status-confirmed { color: #28a745; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div id="authSection">
      <div class="auth-form">
        <h2>Booking App</h2>
        <div id="authError" class="error hidden"></div>
        
        <div id="loginForm">
          <h3>Login</h3>
          <input type="email" id="loginEmail" placeholder="Email" required>
          <input type="password" id="loginPassword" placeholder="Password" required>
          <button onclick="login()" style="width: 100%;">Login</button>
          <p style="text-align: center; margin-top: 10px;">Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Sign Up</a></p>
        </div>

        <div id="signupForm" class="hidden">
          <h3>Sign Up</h3>
          <input type="text" id="signupName" placeholder="Name" required>
          <input type="email" id="signupEmail" placeholder="Email" required>
          <input type="password" id="signupPassword" placeholder="Password" required>
          <button onclick="signup()" style="width: 100%;">Sign Up</button>
          <p style="text-align: center; margin-top: 10px;">Already have an account? <a href="#" onclick="switchTab('login'); return false;">Login</a></p>
        </div>
      </div>
    </div>

    <div id="appSection" class="hidden">
      <header>
        <h1>📅 Booking App</h1>
        <button class="logout" onclick="logout()">Logout</button>
      </header>

      <div class="card">
        <h2>Make a Booking</h2>
        <select id="service" required><option>Select a service</option></select>
        <input type="date" id="date" required>
        <input type="time" id="time" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="city" placeholder="City" required>
        <button onclick="createBooking()" style="width: 100%;">Book Now</button>
      </div>

      <h2 style="color: white; margin-bottom: 20px;">📋 Available Services</h2>
      <div id="services"></div>

      <h2 style="color: white; margin-bottom: 20px;">✅ Your Bookings</h2>
      <div class="bookings" id="bookings"></div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem('token');
    const categoryEmojis = { salon: '💅', restaurant: '🍽️', taxi: '🚕', hotel: '🏨' };

    if (token) showApp(); else showAuth();

    function showAuth() {
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      loadServices();
      loadBookings();
      setInterval(loadBookings, 5000);
    }

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('authError').classList.add('hidden');
    }

    async function signup() {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const errorDiv = document.getElementById('authError');

      try {
        const res = await fetch(`${API}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        
        if (!res.ok) {
          errorDiv.textContent = data.error || 'Signup failed';
          errorDiv.classList.remove('hidden');
          return;
        }

        token = data.token;
        localStorage.setItem('token', token);
        showApp();
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('authError');

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (!res.ok) {
          errorDiv.textContent = data.error || 'Login failed';
          errorDiv.classList.remove('hidden');
          return;
        }

        token = data.token;
        localStorage.setItem('token', token);
        showApp();
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      showAuth();
    }

    async function loadServices() {
      try {
        const res = await fetch(`${API}/services`);
        const services = await res.json();
        const servicesDiv = document.getElementById('services');
        const serviceSelect = document.getElementById('service');
        
        let html = '';
        let currentCategory = '';
        let selectOptions = '<option>Select a service</option>';

        services.forEach(s => {
          if (currentCategory !== s.category) {
            currentCategory = s.category;
            html += `<h3 class="category-title"><span class="category-emoji">${categoryEmojis[s.category] || '•'}</span>${s.category.toUpperCase()}</h3>`;
          }
          html += `
            <div class="card">
              <h3>${s.name}</h3>
              <p>${s.description}</p>
              <p>Duration: ${s.duration_minutes} min | Price: <span class="price">$${s.price}</span></p>
            </div>
          `;
          selectOptions += `<option value="${s.id}">${s.name} - $${s.price}</option>`;
        });

        servicesDiv.innerHTML = html;
        serviceSelect.innerHTML = selectOptions;
      } catch (err) {
        console.error('Error loading services:', err);
      }
    }

    async function loadBookings() {
      if (!token) return;
      try {
        const res = await fetch(`${API}/bookings`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const bookings = await res.json();
        const bookingsDiv = document.getElementById('bookings');
        
        if (bookings.length === 0) {
          bookingsDiv.innerHTML = '<p style="color: white;">No bookings yet. Start booking now!</p>';
          return;
        }
        
        bookingsDiv.innerHTML = bookings.map(b => `
          <div class="card">
            <h3>${b.name}</h3>
            <p>📍 ${b.address}, ${b.city}</p>
            <p>📅 ${b.booking_date} at ${b.booking_time}</p>
            <p>💰 <span class="price">$${b.price}</span></p>
            <p>Status: <span class="status-${b.status}">${b.status.toUpperCase()}</span></p>
            ${b.status !== 'cancelled' ? `<button class="cancel-btn" onclick="cancelBooking('${b.id}')">Cancel Booking</button>` : ''}
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading bookings:', err);
      }
    }

    async function cancelBooking(bookingId) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;

      try {
        console.log('Cancelling booking:', bookingId);
        console.log('Token:', token);
        console.log('API URL:', `${API}/bookings/${bookingId}`);
        
        const res = await fetch(`${API}/bookings/${bookingId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: 'cancelled' })
        });
        
        console.log('Response status:', res.status);
        const data = await res.json();
        console.log('Response data:', data);
        
        if (res.ok) {
          alert('Booking cancelled successfully');
          loadBookings();
        } else {
          alert('Error: ' + (data.error || 'Failed to cancel'));
        }
      } catch (err) {
        console.error('Cancel error:', err);
        alert('Error: ' + err.message);
      }
    }

    async function createBooking() {
      const service_id = document.getElementById('service').value;
      const booking_date = document.getElementById('date').value;
      const booking_time = document.getElementById('time').value;
      const address = document.getElementById('address').value;
      const city = document.getElementById('city').value;

      if (!service_id || service_id === 'Select a service' || !booking_date || !booking_time || !address || !city) {
        alert('Please fill all fields');
        return;
      }

      try {
        const res = await fetch(`${API}/bookings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ service_id, booking_date, booking_time, address, city })
        });
        
        if (res.ok) {
          alert('Booking created successfully!');
          document.getElementById('date').value = '';
          document.getElementById('time').value = '';
          document.getElementById('address').value = '';
          document.getElementById('city').value = '';
          document.getElementById('service').value = '';
          loadBookings();
        } else {
          const data = await res.json();
          alert('Error: ' + (data.error || 'Booking failed'));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
