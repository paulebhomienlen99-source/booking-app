services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8081"
      - "--providers.file.filename=/dynamic.yml"
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./traefik.yml:/traefik.yml
      - ./dynamic.yml:/dynamic.yml
    networks:
      - traefik-net

  booking_postgres:
    image: postgres:15
    container_name: booking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - traefik-net

  booking_backend:
    build:
      context: ./backend
    container_name: booking_backend
    restart: always
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: booking_postgres
      DB_PORT: 5432
      DB_NAME: booking
    expose:
      - "5000"
    networks:
      - traefik-net

  booking_frontend:
    build:
      context: ./frontend
    container_name: booking_frontend
    restart: always
    networks:
      - traefik-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: booking_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    networks:
      - traefik-net

volumes:
  pgdata:

networks:
  traefik-net:
    external: true













